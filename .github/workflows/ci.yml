name: website ci

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitflow:
    name: Git-flow branch rules
    if: github.event_name == 'pull_request'
    uses: voics-app/.github/.github/workflows/gitflow-guard.yml@main

  build:
    name: Build and check static site
    # Pinned: ubuntu-latest is 26.04 now and Playwright has no Chromium build for it yet.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser-test dependencies
        run: npm ci
      - name: Render site from brand.json
        run: npm run build
      - name: Check for hard-coded brand and unresolved tokens
        run: npm run check
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Test public template previews
        run: npx playwright test
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist

  # Publishing to voics.nl happens in the private gitops repo (workflow publish-public): this repo is public and the
  # in-cluster runner that reaches MinIO does not take jobs from public repositories. It picks up the site-dist
  # artifact of the newest successful push to main or a v* tag within 10 minutes.
