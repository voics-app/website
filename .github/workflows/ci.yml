name: website ci

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitflow:
    name: Git-flow branch rules
    if: github.event_name == 'pull_request'
    uses: discordy-voics/.github/.github/workflows/gitflow-guard.yml@main

  build:
    name: Build and check static site
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render site from brand.json
        run: npm run build
      - name: Check for hard-coded brand and unresolved tokens
        run: npm run check
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist

  deploy:
    name: Publish to voics.nl
    # main and release tags go live; other branches only build. The invite page in the same bucket is
    # published by the gitops repo and is left alone (minio-publish never removes objects).
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build]
    uses: discordy-voics/.github/.github/workflows/minio-publish.yml@main
    with:
      artifact: site-dist
      bucket: discordy-site
      short-cache: index.html
